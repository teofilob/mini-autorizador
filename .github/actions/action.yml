name: Build and test Java project
description: Compiles the Maven project and runs its tests.

inputs:
  java-version:
    description: Java version used to build and test the project.
    required: false
    default: "25"
  working-directory:
    description: Directory containing the pom.xml.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
        cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

    - name: Compile and run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mvn --batch-mode --no-transfer-progress clean verify
