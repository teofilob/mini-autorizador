spring.application.name=mini-autorizador
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Mini autorizador bancario em arquitetura hexagonal
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:miniautorizador}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_secure_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.security.username=${APP_SECURITY_USERNAME:username}
app.security.password=${APP_SECURITY_PASSWORD:password}
